name: Share a place or colours
description: Put a place or a colour scheme from Rosie_Mandlebrot on the community list.
title: "Share: "
labels: [submission]
body:
  - type: markdown
    attributes:
      value: |
        In the app, press **Share** on a Library card (a place) or **Share these colours** on the Colours page, copy the code, and paste it below. Once a maintainer approves it, it appears in everyone's Community list, and a 👍 on this issue counts as a star.
  - type: textarea
    id: code
    attributes:
      label: Share code
      description: Starts rmp1. (a place) or rmc1. (colours).
      render: text
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: What makes it good
      description: A sentence or two (optional).
  - type: input
    id: tags
    attributes:
      label: Tags
      description: Comma separated, e.g. spiral, deep, julia (optional).
